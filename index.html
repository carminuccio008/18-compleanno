.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.92) 100%);transition:background .4s}
body.album .shade{background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px)}
.view{display:none;min-height:100vh;padding:24px 20px 28px;flex-direction:column}
.view.on{display:flex}
#home{justify-content:flex-end;max-width:520px;margin:0 auto}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-bottom:8px;font-weight:500}
h1{font-size:clamp(44px,13vw,64px);line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:0 0 28px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:16px;border:0;font:600 15px/1 inherit;font-family:inherit;letter-spacing:.08em;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.pri{background:#fff;color:#000}
.sec{background:var(--glass);color:#fff;border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);margin-top:12px}
.msg{min-height:20px;margin-top:14px;font-size:13px;text-align:center;opacity:.8}
#album{max-width:900px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.back{background:var(--glass);border:1px solid var(--line);color:#fff;border-radius:999px;padding:9px 16px;font:500 15px inherit;font-family:inherit;cursor:pointer}
.add{background:#fff;color:#000;border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}
h2{font-size:34px;letter-spacing:-.03em;margin:0 0 4px}
.sub{opacity:.65;font-size:15px;margin-bottom:20px}
.grid{columns:2;column-gap:8px}
@media(min-width:640px){.grid{columns:3}}
.grid img{width:100%;display:block;border-radius:14px;margin-bottom:8px;cursor:pointer;filter:grayscale(1);break-inside:avoid;background:#222}
.empty{text-align:center;opacity:.6;margin-top:80px;font-size:16px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9;padding:20px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:78vh;border-radius:14px;filter:grayscale(1)}
#lb .row{margin-top:18px;display:flex;gap:10px}
#lb button{background:var(--glass);border:1px solid var(--line);color:#fff;border-radius:999px;padding:10px 18px;font:500 15px inherit;font-family:inherit;cursor:pointer}

  <div class="sub" id="count">Caricamento…</div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Ancora nessuna foto.<br>Scatta la prima!</div>
  <div class="msg" id="msgA"></div>
</section>

<div id="lb"><img id="lbImg" alt=""><div class="row"><button id="lbX">Chiudi</button><button id="lbDel" hidden>Elimina</button></div></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script>
const $=id=>document.getElementById(id);
let db=null,user=null,isOwner=false,local=[],remote=[],curId=null;
const KEY="c18";
function lsGet(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function lsSet(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function show(v){
  $("home").classList.toggle("on",v==="home");$("album").classList.toggle("on",v==="album");
  document.body.classList.toggle("album",v==="album");
  try{history.replaceState(null,"",v==="album"?"#album":"#home")}catch(e){}
  scrollTo(0,0);
}
$("toAlbum").onclick=()=>show("album");$("back").onclick=()=>show("home");
if(location.hash==="#album")show("album");

function render(){
  const list=db?remote:lsGet();
  const g=$("grid");g.innerHTML="";
  list.forEach(p=>{const i=new Image();i.src=p.d;i.loading="lazy";i.onclick=()=>{curId=p.id;$("lbImg").src=p.d;$("lbDel").hidden=!(isOwner&&db);$("lb").classList.add("on")};g.appendChild(i)});
  $("empty").hidden=list.length>0;
  $("count").textContent=list.length===1?"1 foto":list.length+" foto";
}
$("lbX").onclick=()=>$("lb").classList.remove("on");
$("lb").onclick=e=>{if(e.target.id==="lb")$("lb").classList.remove("on")};
$("lbDel").onclick=async()=>{if(!confirm("Eliminare questa foto?"))return;try{await db.collection("photos").doc(curId).delete()}catch(e){}$("lb").classList.remove("on")};

function toJpeg(file){return new Promise((ok,ko)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const M=1000,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);let q=.7,d=c.toDataURL("image/jpeg",q);
    while(d.length>170000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}ok(d)};
  im.onerror=ko;im.src=u})}

$("cam").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const m=[$("msgH"),$("msgA")];m.forEach(x=>x.textContent="Salvataggio…");
  try{
    const d=await toJpeg(f);
    if(db){await db.collection("photos").doc().set({d,t:Date.now()})}
    else{const a=lsGet();a.unshift({id:"l"+Date.now(),d});lsSet(a);render()}
    m.forEach(x=>x.textContent="Foto salvata nell’album ✓");
    setTimeout(()=>m.forEach(x=>x.textContent=""),2500);
  }catch(err){m.forEach(x=>x.textContent="Errore nel salvataggio, riprova.")}
};

(async()=>{
  render();
  try{
    if(!window.claude)return;
    user=await claude.use("user");isOwner=user?user.isOwner():false;
    db=await claude.use("db");
    if(db){
      db.collection("photos").orderBy("t","desc").onSnapshot(s=>{remote=s.docs.map(x=>({id:x.id,d:x.data().d}));render()},()=>{db=null;render()});
    }
  }catch(e){}
})();
</script></body></html>
